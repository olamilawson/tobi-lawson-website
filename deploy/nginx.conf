# tobilawson.com: rules to paste inside the site's existing `server { ... }`
# block, above any other `location` blocks. On the VPS that file is usually
# /etc/nginx/sites-available/tobilawson.com (or .../default).
#
# The web root is the git checkout itself, so without these rules nginx serves
# the repository's own files: /.git/ (the whole history), the .md and .sql
# files, package.json and the render scripts. .htaccess does nothing on nginx.
#
# After editing:   sudo nginx -t && sudo systemctl reload nginx

# Hidden files and folders: .git, .claude, .agents, .gitignore, .htaccess.
# Keep /.well-known/ open for certificate renewal.
location ~ /\.(?!well-known/) {
    return 404;
}

# Repository files that are not part of the website.
location ~* \.(md|sql|toml|lock|mjs)$ {
    return 404;
}
location ~* ^/(package|package-lock|vercel)\.json$ {
    return 404;
}
location ^~ /node_modules/ {
    return 404;
}
location ^~ /scripts/ {
    return 404;
}
location ^~ /deploy/ {
    return 404;
}

# The Now page became the Projects page.
location ~ ^/now(/|/index\.html|\.html)?$ {
    return 301 /projects/;
}
