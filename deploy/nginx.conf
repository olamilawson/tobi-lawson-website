# tobilawson.com: rules to paste inside the site's existing `server { ... }`
# block, above any other `location` blocks. On the VPS that file is usually
# /etc/nginx/sites-available/tobilawson.com (or .../default).
#
# The web root is the git checkout itself, so without these rules nginx serves
# the repository's own files: /.git/ (the whole history), the .md and .sql
# files, package.json and the render scripts. .htaccess does nothing on nginx.
#
# After editing:   sudo nginx -t && sudo systemctl reload nginx

# HTML is always revalidated; see deploy/nginx-http.conf for the map.
expires $tobilawson_html_expires;

# Hidden files and folders: .git, .claude, .agents, .gitignore, .htaccess.
# Keep /.well-known/ open for certificate renewal.
location ~ /\.(?!well-known/) {
    return 404;
}

# Repository files that are not part of the website.
location ~* \.(md|sql|toml|lock|mjs)$ {
    return 404;
}
location ~* ^/(package|package-lock|vercel)\.json$ {
    return 404;
}
location ^~ /node_modules/ {
    return 404;
}
location ^~ /scripts/ {
    return 404;
}
location ^~ /deploy/ {
    return 404;
}
# The personal agent's code (agent/). It runs as its own service; none of it is a web file.
location ^~ /agent/ {
    return 404;
}

# The personal agent's API (agent/deploy/README.md). The service listens on
# 127.0.0.1:8200 only; nginx is its one way in. The trailing slashes strip the
# prefix, so /api/agent/health reaches the service as /health.
location ^~ /api/agent/ {
    proxy_pass http://127.0.0.1:8200/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A message with attached files: five files of up to 10 MB each.
    client_max_body_size 55m;
    # A model's answer can take a while; the API answers at once and works in the background,
    # so this only covers slow uploads.
    proxy_read_timeout 120s;
}

# The Now page became the Projects page.
location ~ ^/now(/|/index\.html|\.html)?$ {
    return 301 /projects/;
}
