# tobilawson.com: copy to /etc/nginx/conf.d/tobilawson-cache.conf
# (nginx loads conf.d at the http level, where a map has to live).
#
# HTML responses get "expires epoch", which sends Cache-Control: no-cache, so
# browsers check for a newer page on every visit instead of reusing an old one.
# The check is a cheap 304 when nothing changed. Everything else keeps
# whatever caching the site's config already gives it.
map $sent_http_content_type $tobilawson_html_expires {
    default      off;
    ~text/html   epoch;
}

# Rate limits for the personal agent's API (deploy/nginx.conf, /api/agent/).
# One owner uses it, so ordinary use stays far below these. Sign-in gets the
# tightest limit; the service also locks sign-in after five failures.
limit_req_zone $binary_remote_addr zone=tobi_agent:10m rate=10r/s;
# Only sign-in attempts (POST) count; the page checks the session with GET on every load.
map $request_method $tobi_agent_signin_key {
    POST     $binary_remote_addr;
    default  "";
}
limit_req_zone $tobi_agent_signin_key zone=tobi_agent_signin:10m rate=6r/m;
limit_req_status 429;
