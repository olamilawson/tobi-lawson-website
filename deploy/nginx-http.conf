# tobilawson.com: copy to /etc/nginx/conf.d/tobilawson-cache.conf
# (nginx loads conf.d at the http level, where a map has to live).
#
# HTML responses get "expires epoch", which sends Cache-Control: no-cache, so
# browsers check for a newer page on every visit instead of reusing an old one.
# The check is a cheap 304 when nothing changed. Everything else keeps
# whatever caching the site's config already gives it.
map $sent_http_content_type $tobilawson_html_expires {
    default      off;
    ~text/html   epoch;
}
