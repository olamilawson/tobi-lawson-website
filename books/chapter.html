<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Tobi Lawson</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <meta name="description" content="A chapter from a book by Tobi Lawson." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/base.css?v=3.1.1" />
  <link rel="stylesheet" href="/style.css?v=3.1.1" />
</head>
<body>

  <header class="header-nav fade-up">
    <a href="/" class="meta-brand" data-cms="siteTitle">Tobi Lawson</a>
    <nav class="meta-links meta" aria-label="Primary Navigation">
      <a href="/" data-cms="navHome">Home</a>
      <a href="/books/" aria-current="page" data-cms="navBooks">Books</a>
      <a href="/writing/" data-cms="navWriting">Writing</a>
      <a href="/now/" data-cms="navNow">Now</a>
      <a href="/course/" data-cms="navCourse">Course</a>
      <a href="/about/" data-cms="navAbout">About</a>
    </nav>
  </header>

  <main id="main">
    <article class="prose-container fade-up delay-1" data-cms-chapter>
      <header class="article-header">
        <div class="article-meta meta">
          <a data-cms-chapter-back href="/books/" style="text-decoration: underline;">
            <span data-cms-chapter-booktitle>Book</span>
          </a>
          <span>·</span>
          <span data-cms-chapter-status>Chapter</span>
        </div>
        <h1 data-cms-chapter-title>Loading…</h1>
        <p class="article-dek" data-cms-chapter-desc></p>
        <div class="meta" style="color: var(--text-muted);">By <span data-cms="siteTitle">Tobi Lawson</span></div>
      </header>

      <div class="article-body" data-cms-chapter-body></div>

      <div style="margin-top: 4rem; padding-top: 2rem; border-top: 1px solid var(--line);">
        <div class="meta" style="margin-bottom: 1.5rem;" data-cms="booksTocEyebrow">TABLE OF CONTENTS</div>
        <div class="grid-3" style="margin-bottom: 2rem;" data-cms-chapter-nav></div>
        <a href="/books/" class="grid-item-link">← All chapters</a>
      </div>
    </article>
  </main>

  <footer class="fade-up">
    <div>
      <div class="meta-brand" style="margin-bottom: 0.5rem;" data-cms="siteTitle">Tobi Lawson</div>
      <p class="footer-tagline" style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.5rem;" data-cms="footerTagline">Investor, builder, and writer based in Lagos.</p>
      <div class="meta footer-copyright" style="color: var(--text-muted); font-size: 0.8rem;" data-cms="footerCopyright">
        © 2026 Tobi Lawson. All rights reserved.
      </div>
    </div>
    <div class="meta-links meta footer-links">
      <a href="mailto:olamilawson@gmail.com" class="footer-email-link" data-cms="footerEmailLabel" data-cms-attr="mailto:contactEmail">Email</a>
      <a href="https://www.1914reader.com/" target="_blank" rel="noopener noreferrer" class="footer-custom-link-1" data-cms="footerLink1Name" data-cms-attr="href:footerLink1Url">1914 Reader</a>
      <a href="http://lagosurban.com" target="_blank" rel="noopener noreferrer" class="footer-custom-link-2" data-cms="footerLink2Name" data-cms-attr="href:footerLink2Url">Lagos Urban</a>
      <a href="https://miomirlabs.com/" target="_blank" rel="noopener noreferrer" class="footer-custom-link-3" data-cms="footerLink3Name" data-cms-attr="href:footerLink3Url">Miomir Labs</a>
    </div>
  </footer>

  <script type="module" src="/app.js?v=3.1.1"></script>
</body>
</html>
